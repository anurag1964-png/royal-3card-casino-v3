name: Build Signed Royal 3-Card Casino APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Set up Android SDK
        run: |
          mkdir -p android-sdk/cmdline-tools
          curl -sSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o cmdline-tools.zip
          unzip -q cmdline-tools.zip -d android-sdk/cmdline-tools
          mv android-sdk/cmdline-tools/cmdline-tools android-sdk/cmdline-tools/latest
          export ANDROID_SDK_ROOT=$PWD/android-sdk
          export ANDROID_HOME=$PWD/android-sdk
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH

      - name: Create Final Production Android Project
        run: |
          mkdir -p android-project/app/src/main/assets
          mkdir -p android-project/app/src/main/java/com/playzonestudios/royal3cardcasino3d
          cp index.html android-project/app/src/main/assets/index.html
          cp "50 human photo.jpg" "android-project/app/src/main/assets/50 human photo.jpg"

          cat << 'EOF' > android-project/app/src/main/assets/AppstoreAuthenticationKey.pem
          -----BEGIN PUBLIC KEY-----
          MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEArB+KtkAoifs7cHPpvwOB
          FVxJminWdJqVd1Yx1gJHX4wLR9FZqjY6GVdYaIWUq0Wtvh2MPhErvwqOCAbm9F9w
          KgWQZVHUvYn3m4zcw0oa7KkEjeXFDrcGorc0tx/dFnEFjwHNVAGGSq5YWjOiggQS
          6Xbs+BG7MuCh0qlAfdosj2dwRZtYvjFlbi6aXQE9ht29Nr0wCARZOZrzyVEfLDiI
          ukt8xj4Lt/DyjASQYWERbtcHjOjnP6rzXmUvatZGYt7vjnUW0IbWLgQ0qbQNEHWn
          DwS4CcXTiIevwQDzg/ChJsm+rCirf1U6Xft8+MPSyL15co9JJod5uYW8hBLX0Qsg
          7wIDAQAB
          -----END PUBLIC KEY-----
          EOF

          cat << EOF > android-project/local.properties
          sdk.dir=$ANDROID_HOME
          EOF

          cat << 'EOF' > android-project/gradle.properties
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat << 'EOF' > android-project/settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "Royal3CardCasino3D"
          include ':app'
          EOF

          cat << 'EOF' > android-project/app/build.gradle
          plugins {
              id 'com.android.application' version '8.3.2'
          }

          android {
              namespace "com.playzonestudios.royal3cardcasino3d"
              compileSdk 34

              defaultConfig {
                  applicationId "com.playzonestudios.royal3cardcasino3d"
                  minSdk 23
                  targetSdk 34
                  versionCode 21003
                  versionName "3.3"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'com.unity3d.ads:unity-ads:4.12.5'
              implementation 'com.amazon.device:amazon-appstore-sdk:3.0.5'
          }
          EOF

          cat << 'EOF' > android-project/app/proguard-rules.pro
          -keep class com.playzonestudios.royal3cardcasino3d.** { *; }
          -keep class com.unity3d.** { *; }
          -keep class com.amazon.device.** { *; }
          -dontwarn com.amazon.**
          EOF

          cat << 'EOF' > android-project/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />

              <application
                  android:allowBackup="true"
                  android:label="Royal 3-Card Casino 3D"
                  android:usesCleartextTraffic="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar.Fullscreen">

                  <meta-data
                      android:name="com.amazon.appstore.app_id"
                      android:value="amzn1.devportal.mobileapp.539a343ffb44448a92fc7b4dcdd981b8" />
                  <meta-data
                      android:name="com.amazon.appstore.release_id"
                      android:value="amzn1.devportal.apprelease.668503d7dfe243e994532915303f0079" />

                  <receiver
                      android:name="com.amazon.device.iap.ResponseReceiver"
                      android:permission="com.amazon.inapp.purchasing.Permission.NOTIFY"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="com.amazon.inapp.purchasing.NOTIFY" />
                      </intent-filter>
                  </receiver>

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > android-project/app/src/main/java/com/playzonestudios/royal3cardcasino3d/MainActivity.java
          package com.playzonestudios.royal3cardcasino3d;

          import android.app.Activity;
          import android.content.SharedPreferences;
          import android.os.Bundle;
          import android.view.View;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import com.amazon.device.iap.PurchasingListener;
          import com.amazon.device.iap.PurchasingService;
          import com.amazon.device.iap.model.FulfillmentResult;
          import com.amazon.device.iap.model.ProductDataResponse;
          import com.amazon.device.iap.model.PurchaseResponse;
          import com.amazon.device.iap.model.PurchaseUpdatesResponse;
          import com.amazon.device.iap.model.Receipt;
          import com.amazon.device.iap.model.UserDataResponse;
          import com.unity3d.ads.IUnityAdsInitializationListener;
          import com.unity3d.ads.IUnityAdsLoadListener;
          import com.unity3d.ads.IUnityAdsShowListener;
          import com.unity3d.ads.UnityAds;
          import com.unity3d.ads.UnityAdsShowOptions;
          import java.util.HashSet;
          import java.util.Set;

          public class MainActivity extends Activity {
              private static final String UNITY_GAME_ID = "800438848";
              private static final String UNITY_PLACEMENT_ID = "BP_Rewarded_Android";
              private static final String PREFS_NAME = "royal_iap_prefs";
              private static final String KEY_RECEIPTS = "fulfilled_receipts";

              private WebView webView;
              private boolean adLoaded = false;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().getDecorView().setSystemUiVisibility(
                      View.SYSTEM_UI_FLAG_FULLSCREEN |
                      View.SYSTEM_UI_FLAG_HIDE_NAVIGATION |
                      View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                  );

                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setMediaPlaybackRequiresUserGesture(false);

                  webView.setWebViewClient(new WebViewClient());
                  webView.addJavascriptInterface(new NativeBridge(), "NativeBridge");
                  webView.loadUrl("file:///android_asset/index.html");

                  initUnityAds();
                  initAmazonIap();
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  try {
                      PurchasingService.getUserData();
                      PurchasingService.getPurchaseUpdates(false);
                  } catch (Throwable ignored) {}
              }

              private void initUnityAds() {
                  try {
                      UnityAds.initialize(this, UNITY_GAME_ID, false, new IUnityAdsInitializationListener() {
                          @Override
                          public void onInitializationComplete() {
                              preloadRewardedAd();
                          }

                          @Override
                          public void onInitializationFailed(UnityAds.UnityAdsInitializationError error, String message) {
                              adLoaded = false;
                          }
                      });
                  } catch (Throwable t) {
                      adLoaded = false;
                  }
              }

              private void preloadRewardedAd() {
                  UnityAds.load(UNITY_PLACEMENT_ID, new IUnityAdsLoadListener() {
                      @Override
                      public void onUnityAdsAdLoaded(String placementId) {
                          adLoaded = true;
                      }

                      @Override
                      public void onUnityAdsFailedToLoad(String placementId, UnityAds.UnityAdsLoadError error, String message) {
                          adLoaded = false;
                      }
                  });
              }

              private void initAmazonIap() {
                  try {
                      PurchasingService.registerListener(this, new PurchasingListener() {
                          @Override
                          public void onUserDataResponse(UserDataResponse response) {}

                          @Override
                          public void onProductDataResponse(ProductDataResponse response) {}

                          @Override
                          public void onPurchaseResponse(PurchaseResponse response) {
                              if (response == null) {
                                  notifyJsPurchaseResult("", false);
                                  return;
                              }
                              if (response.getRequestStatus() == PurchaseResponse.RequestStatus.SUCCESSFUL) {
                                  handleReceipt(response.getReceipt());
                              } else {
                                  notifyJsPurchaseResult("", false);
                              }
                          }

                          @Override
                          public void onPurchaseUpdatesResponse(PurchaseUpdatesResponse response) {
                              if (response != null && response.getRequestStatus() == PurchaseUpdatesResponse.RequestStatus.SUCCESSFUL) {
                                  for (Receipt receipt : response.getReceipts()) {
                                      handleReceipt(receipt);
                                  }
                                  if (response.hasMore()) {
                                      PurchasingService.getPurchaseUpdates(false);
                                  }
                              }
                          }
                      });
                  } catch (Throwable ignored) {}
              }

              private synchronized void handleReceipt(Receipt receipt) {
                  if (receipt == null || receipt.isCanceled()) {
                      notifyJsPurchaseResult("", false);
                      return;
                  }
                  String receiptId = receipt.getReceiptId();
                  String sku = receipt.getSku();
                  if (receiptId == null || sku == null || sku.isEmpty()) {
                      notifyJsPurchaseResult("", false);
                      return;
                  }

                  SharedPreferences prefs = getSharedPreferences(PREFS_NAME, MODE_PRIVATE);
                  Set<String> existing = new HashSet<>(prefs.getStringSet(KEY_RECEIPTS, new HashSet<>()));
                  if (!existing.contains(receiptId)) {
                      existing.add(receiptId);
                      prefs.edit().putStringSet(KEY_RECEIPTS, existing).apply();
                      notifyJsPurchaseResult(sku, true);
                  }
                  PurchasingService.notifyFulfillment(receiptId, FulfillmentResult.FULFILLED);
              }

              private void notifyJsAdResult(final String status) {
                  runOnUiThread(() -> {
                      if (webView != null) {
                          webView.evaluateJavascript(
                              "if(window.onUnityAdComplete){window.onUnityAdComplete('" + status + "');}",
                              null
                          );
                      }
                  });
              }

              private void notifyJsPurchaseResult(final String sku, final boolean ok) {
                  runOnUiThread(() -> {
                      if (webView != null) {
                          webView.evaluateJavascript(
                              "if(window.onAmazonPurchaseComplete){window.onAmazonPurchaseComplete('" + sku + "', " + ok + ");}",
                              null
                          );
                      }
                  });
              }

              private void showLoadedAd() {
                  UnityAds.show(MainActivity.this, UNITY_PLACEMENT_ID, new UnityAdsShowOptions(), new IUnityAdsShowListener() {
                      @Override
                      public void onUnityAdsShowFailure(String id, UnityAds.UnityAdsShowError error, String message) {
                          adLoaded = false;
                          preloadRewardedAd();
                          notifyJsAdResult("FAILED");
                      }

                      @Override
                      public void onUnityAdsShowStart(String id) {}

                      @Override
                      public void onUnityAdsShowClick(String id) {}

                      @Override
                      public void onUnityAdsShowComplete(String id, UnityAds.UnityAdsShowCompletionState state) {
                          adLoaded = false;
                          preloadRewardedAd();
                          if (state == UnityAds.UnityAdsShowCompletionState.COMPLETED) {
                              notifyJsAdResult("COMPLETED");
                          } else {
                              notifyJsAdResult("SKIPPED");
                          }
                      }
                  });
              }

              public class NativeBridge {
                  @JavascriptInterface
                  public void showRewardedAd() {
                      runOnUiThread(() -> {
                          try {
                              if (adLoaded) {
                                  showLoadedAd();
                              } else {
                                  UnityAds.load(UNITY_PLACEMENT_ID, new IUnityAdsLoadListener() {
                                      @Override
                                      public void onUnityAdsAdLoaded(String placementId) {
                                          adLoaded = true;
                                          showLoadedAd();
                                      }

                                      @Override
                                      public void onUnityAdsFailedToLoad(String placementId, UnityAds.UnityAdsLoadError error, String message) {
                                          adLoaded = false;
                                          notifyJsAdResult("FAILED");
                                      }
                                  });
                              }
                          } catch (Throwable t) {
                              notifyJsAdResult("FAILED");
                          }
                      });
                  }

                  @JavascriptInterface
                  public void purchaseSku(final String sku) {
                      runOnUiThread(() -> {
                          try {
                              PurchasingService.purchase(sku);
                          } catch (Throwable t) {
                              notifyJsPurchaseResult(sku, false);
                          }
                      });
                  }
              }
          }
          EOF

      - name: Generate Release Keystore and Sign APK
        run: |
          cd android-project
          gradle assembleRelease --no-daemon

          keytool -genkeypair -v \
            -keystore release-keystore.jks \
            -alias royalkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass Royal@1234 \
            -keypass Royal@1234 \
            -dname "CN=Playzone Studio, OU=Games, O=Playzone Studio, L=Aligarh, ST=Uttar Pradesh, C=IN"

          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          "$BUILD_TOOLS/zipalign" -v -p 4 \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            app/build/outputs/apk/release/app-release-aligned.apk

          "$BUILD_TOOLS/apksigner" sign \
            --ks release-keystore.jks \
            --ks-key-alias royalkey \
            --ks-pass pass:Royal@1234 \
            --key-pass pass:Royal@1234 \
            --out app/build/outputs/apk/release/Royal-3-Card-Casino-3D-Signed.apk \
            app/build/outputs/apk/release/app-release-aligned.apk

      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Royal-3-Card-Casino-3D-Signed-APK
          path: android-project/app/build/outputs/apk/release/Royal-3-Card-Casino-3D-Signed.apk
