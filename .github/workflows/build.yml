- name: Generate Release Keystore and Sign APK
        run: |
          cd android-project

          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          gradle wrapper --gradle-version 8.7 --distribution-type bin --no-daemon
          ./gradlew assembleRelease --no-daemon

          keytool -genkeypair -v \
            -keystore release-keystore.jks \
            -alias royalkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass Royal@1234 \
            -keypass Royal@1234 \
            -dname "CN=Playzone Studio, OU=Games, O=Playzone Studio, L=Aligarh, ST=Uttar Pradesh, C=IN"

          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          "$BUILD_TOOLS/zipalign" -v -p 4 \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            app/build/outputs/apk/release/app-release-aligned.apk

          "$BUILD_TOOLS/apksigner" sign \
            --ks release-keystore.jks \
            --ks-key-alias royalkey \
            --ks-pass pass:Royal@1234 \
            --key-pass pass:Royal@1234 \
            --out app/build/outputs/apk/release/Royal-3-Card-Casino-3D-Signed.apk \
            app/build/outputs/apk/release/app-release-aligned.apk
