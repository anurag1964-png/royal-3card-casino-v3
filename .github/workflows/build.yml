name: Build Signed Royal 3-Card Casino APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        run: |
          mkdir -p android-sdk/cmdline-tools
          curl -sSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o cmdline-tools.zip
          unzip -q cmdline-tools.zip -d android-sdk/cmdline-tools
          mv android-sdk/cmdline-tools/cmdline-tools android-sdk/cmdline-tools/latest
          export ANDROID_SDK_ROOT=$PWD/android-sdk
          export ANDROID_HOME=$PWD/android-sdk
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH

      - name: Create Android WebView Wrapper Project
        run: |
          mkdir -p android-project/app/src/main/assets
          mkdir -p android-project/app/src/main/java/com/playzonestudios/royal3cardcasino3d
          cp index.html android-project/app/src/main/assets/index.html
          cp "50 human photo.jpg" "android-project/app/src/main/assets/50 human photo.jpg"

          cat << EOF > android-project/local.properties
          sdk.dir=$ANDROID_HOME
          EOF

          cat << 'EOF' > android-project/settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "Royal3CardCasino3D"
          include ':app'
          EOF

          cat << 'EOF' > android-project/app/build.gradle
          plugins {
              id 'com.android.application' version '8.3.2'
          }

          android {
              namespace "com.playzonestudios.royal3cardcasino3d"
              compileSdk 34

              defaultConfig {
                  applicationId "com.playzonestudios.royal3cardcasino3d"
                  minSdk 23
                  targetSdk 34
                  versionCode 21000
                  versionName "3.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }
          }
          EOF

          cat << 'EOF' > android-project/app/proguard-rules.pro
          -keep class com.playzonestudios.royal3cardcasino3d.** { *; }
          EOF

          cat << 'EOF' > android-project/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />

              <application
                  android:allowBackup="true"
                  android:label="Royal 3-Card Casino 3D"
                  android:usesCleartextTraffic="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar.Fullscreen">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > android-project/app/src/main/java/com/playzonestudios/royal3cardcasino3d/MainActivity.java
          package com.playzonestudios.royal3cardcasino3d;

          import android.app.Activity;
          import android.os.Bundle;
          import android.view.View;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().getDecorView().setSystemUiVisibility(
                      View.SYSTEM_UI_FLAG_FULLSCREEN |
                      View.SYSTEM_UI_FLAG_HIDE_NAVIGATION |
                      View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                  );

                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setMediaPlaybackRequiresUserGesture(false);

                  webView.setWebViewClient(new WebViewClient());
                  webView.addJavascriptInterface(new NativeBridge(), "NativeBridge");
                  webView.loadUrl("file:///android_asset/index.html");
              }

              public class NativeBridge {
                  @JavascriptInterface
                  public void showRewardedAd() {
                      runOnUiThread(() -> webView.evaluateJavascript(
                          "if(window.onUnityAdComplete){window.onUnityAdComplete('COMPLETED');}",
                          null
                      ));
                  }

                  @JavascriptInterface
                  public void purchaseSku(String sku) {
                      runOnUiThread(() -> webView.evaluateJavascript(
                          "if(window.onAmazonPurchaseComplete){window.onAmazonPurchaseComplete('" + sku + "', true);}",
                          null
                      ));
                  }
              }
          }
          EOF

      - name: Generate Release Keystore and Sign APK
        run: |
          cd android-project
          gradle assembleRelease --no-daemon

          keytool -genkeypair -v \
            -keystore release-keystore.jks \
            -alias royalkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass Royal@1234 \
            -keypass Royal@1234 \
            -dname "CN=Playzone Studio, OU=Games, O=Playzone Studio, L=Aligarh, ST=Uttar Pradesh, C=IN"

          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          "$BUILD_TOOLS/zipalign" -v -p 4 \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            app/build/outputs/apk/release/app-release-aligned.apk

          "$BUILD_TOOLS/apksigner" sign \
            --ks release-keystore.jks \
            --ks-key-alias royalkey \
            --ks-pass pass:Royal@1234 \
            --key-pass pass:Royal@1234 \
            --out app/build/outputs/apk/release/Royal-3-Card-Casino-3D-Signed.apk \
            app/build/outputs/apk/release/app-release-aligned.apk

      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Royal-3-Card-Casino-3D-Signed-APK
          path: android-project/app/build/outputs/apk/release/Royal-3-Card-Casino-3D-Signed.apk
